name: Deploy Admin Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy staging on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ADMIN_SERVER_HOST }}
          username: root
          key: ${{ secrets.ADMIN_SERVER_SSH_KEY }}
          port: 22
          script: |
            /var/www/shavi.itmart24.com/deploy-staging.sh